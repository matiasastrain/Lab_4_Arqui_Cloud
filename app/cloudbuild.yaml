# Lo ejecuta Terraform (terraform/images.tf) con una cuenta de servicio propia de build.
# Con cuenta de servicio propia, los logs deben ir a Cloud Logging.
steps:
  - name: gcr.io/cloud-builders/docker
    args: ["build", "-t", "${_IMAGE}", "."]
images:
  - "${_IMAGE}"
options:
  logging: CLOUD_LOGGING_ONLY
